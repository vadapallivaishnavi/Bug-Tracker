services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: team_activity_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team_activity_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Flask Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: team_activity_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/team_activity_db
      FLASK_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
    ports:
      - "5100:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./config.yaml:/app/config.yaml
    command: sh -c "gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 'wsgi:app'"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: team_activity_frontend
    ports:
      - "3100:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5100/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - app_network


  # React Frontend - REMOTE/FRP build
  # Same source as `frontend`, but built with REACT_APP_API_URL baked in at
  # build time to point at the frp-exposed backend port, so it works
  # correctly for anyone hitting it through frpc rather than localhost.
  frontend-remote:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REMOTE_API_URL:-http://13.203.201.106:6037/api}
    container_name: team_activity_frontend_remote
    ports:
      - "3101:3000"
    depends_on:
      - backend
    networks:
      - app_network
  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: team_activity_nginx
    ports:
      - "180:80"
      - "543:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
